#Maven = The actual build automation tool.

#opening the configuration that helps the mvnw script determine which Maven version to use.

#It is a Java properties file.

#Java properties files generally store configuration as key-value pairs:

#Maven Wrapper is a mechanism that allows developers to run a Maven project without manually installing Maven globally on their computers.

#The wrapper handles obtaining and invoking the configured Maven distribution.

#Maven Wrapper = The mechanism that helps launch Maven.

#A distribution is a packaged form of software that can be downloaded and used.

#The only-script setting indicates that the wrapper uses the script-only distribution approach rather than downloading a separate wrapper JAR.

#This specifies the URL from which Maven Wrapper downloads the actual Apache Maven distribution.

#Developer executes mvnw

#The wrapper script starts.

#Reads wrapper configuration

#It uses maven-wrapper.properties.

wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
