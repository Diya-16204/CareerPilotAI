server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: careerpilot-api
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/careerpilot?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DATABASE_USERNAME:careerpilot}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  ats:
    weights:
      required-skills: ${ATS_WEIGHT_REQUIRED_SKILLS:0.40}
      preferred-skills: ${ATS_WEIGHT_PREFERRED_SKILLS:0.15}
      relevant-experience: ${ATS_WEIGHT_RELEVANT_EXPERIENCE:0.15}
      projects-certifications: ${ATS_WEIGHT_PROJECTS_CERTIFICATIONS:0.10}
      education: ${ATS_WEIGHT_EDUCATION:0.10}
      role-keywords: ${ATS_WEIGHT_ROLE_KEYWORDS:0.10}
  ai:
    provider: ${AI_PROVIDER:local}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:20000}
  automation:
    frontend-url: ${CAREERPILOT_AUTOMATION_FRONTEND_URL:http://localhost:5173}
    api-base-url: ${CAREERPILOT_AUTOMATION_API_BASE_URL:http://localhost:8080/api/v1}
    node-executable: ${CAREERPILOT_AUTOMATION_NODE:node}
    runner-script: ${CAREERPILOT_AUTOMATION_SCRIPT:../frontend/scripts/portal-automation.mjs}
    frontend-directory: ${CAREERPILOT_AUTOMATION_FRONTEND_DIRECTORY:../frontend}
    browser: ${CAREERPILOT_AUTOMATION_BROWSER:msedge}
    timeout-seconds: ${CAREERPILOT_AUTOMATION_TIMEOUT_SECONDS:90}
    evidence-directory: ${CAREERPILOT_AUTOMATION_EVIDENCE:../.tools/automation-evidence}
  upload:
    directory: ${UPLOAD_DIR:./data/uploads/resumes}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  cors:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
