server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: careerpilot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
    username: ${DATABASE_USERNAME:careerpilot}
    password: ${DATABASE_PASSWORD:change-me-locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  ai:
    provider: ${AI_PROVIDER:local}
  upload:
    directory: ${UPLOAD_DIR:./data/uploads/resumes}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-to-a-random-value-32-bytes-min}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  cors:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
